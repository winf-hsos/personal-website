project:
  type: website
  render:
    # Nur die .qmd-Seiten. "quarto publish" schiebt _site/, und dorthin
    # rendert Quarto sonst jede .md im Projekt mit, ob getrackt oder nicht --
    # etwa images/LIESMICH.md oder eine interne STATUS.md. Der Blog ist am
    # 2026-10-23 entfallen (Nicolas schreibt kuenftig auf Substack); seine
    # Ordner drafts/ und posts/ gibt es nicht mehr.
    - "*.qmd"
  resources:
    # Ohne diese beiden Zeilen verliert jeder Build die Domain
    # (CNAME) und laesst GitHub die Seite durch Jekyll schicken.
    - CNAME
    - .nojekyll
    # Selbst gehostete Schrift, referenziert aus styles.css.
    - fonts/

website:
  title: "Prof. Dr. Nicolas Meseth"
  site-url: "https://nicolasmeseth.de"
  # Monogramm NM, Hochschulblau. Quelle ist das SVG -- die PNG daneben
  # sind daraus erzeugt (Skript siehe images/LIESMICH.md) und dienen als
  # Rueckfall fuer aeltere Browser und als Symbol auf dem iOS-Startbildschirm.
  favicon: images/favicon.svg
  # announcement: 
  #   icon: info-circle
  #   dismissable: true
  #   content: "**Alert** - this is some information that you should pay attention to"
  #   type: primary
  #   position: below-navbar
  llms-txt: true
  # Beitraege mit "draft: true" gar nicht erst bauen. Quarto laesst sie sonst
  # nur aus Liste, Sitemap und Suche heraus, legt die Seite aber trotzdem in
  # _site/ -- und "quarto publish" stellt sie dann unverlinkt online, egal
  # wofuer veroeffentlicht wird. Seit dem Wegfall des Blogs nur noch
  # Absicherung, falls je wieder eine Seite als Entwurf entsteht.
  draft-mode: gone
  navbar:
    title: "Nicolas Meseth"
    #logo: images/hs-logo.png
    left:
      - href: index.qmd
        text: Home

      - href: teaching.qmd
        text: Teaching

      - href: research.qmd
        text: Research

      - href: software.qmd
        text: Software

      - href: cv.qmd
        text: CV

format:
  html:
    # Eigenes Theme seit 2026-10-26 statt cosmo (das ausserdem eine Schrift
    # von Google Fonts nachlud). Hell und dunkel, mit Umschalter in der Leiste;
    # ohne Wahl folgt die Seite der Einstellung des Systems.
    theme:
      light: [default, theme-light.scss]
      dark: [default, theme-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    page-layout: article
    # Besucherzaehlung mit GoatCounter. Bewusst gewaehlt, weil es kein
    # Cookie setzt und keine personenbezogenen Daten speichert -- deshalb
    # hier nichts weiter einbinden. Auswertung: nmeseth.goatcounter.com
    include-in-header:
      - text: |
          <script data-goatcounter="https://nmeseth.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
      # Rueckfall fuer Browser ohne SVG-Favicon und das iOS-Symbol; Quarto
      # kennt dafuer kein eigenes Feld. Die Pfade stehen absolut, weil diese
      # Zeilen in jede Seite kopiert werden -- Quarto rechnet sie beim
      # Rendern je Unterseite in relative um.
      - text: |
          <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
          <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
